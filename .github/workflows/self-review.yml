# Dogfood: this repo's PRs are reviewed by this repo's bot, at the committed
# ref rather than a release tag.
name: "Code Review Bot"

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: self-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@bot')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@bot review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Comment events run with the API key, so a fork's code is never checked
      # out next to it: a comment on a PR from another repo reviews the base.
      - name: Resolve the ref to review
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          ref="$GITHUB_SHA"
          if [ "$EVENT" = pull_request ]; then
            ref="$PR_HEAD_SHA"
          elif [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" = false ]; then
            ref="${PR_HEAD_SHA:-refs/pull/$PR_NUMBER/head}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ steps.ref.outputs.ref }}

      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          repo-notes: |
            ## The stack

            This repo ships the code review bot itself: a composite GitHub Action
            (`action.yml`), a reusable workflow (`.github/workflows/review.yml`), the agent's
            instructions (`prompts/`), and `scripts/review.py`, which runs the review passes,
            merges their findings, and posts them. `eval/` is an offline harness that measures
            the prompt; it never runs in CI.

            ## What CI already covers, so never mention it

            commitlint (conventional commits with a required scope), markdownlint,
            actionlint over `.github/workflows/` and `examples/` - which includes shellcheck
            over every `run:` block - shellcheck over `scripts/` and the git hooks, and the unit
            tests in `tests/` for `scripts/review.py`.

            ## What matters here

            - The prompt is the product. Judge a change to `prompts/BASE_PROMPT.md` on whether
              it raises signal or adds noise, and on whether it stays repo-agnostic: anything
              that only applies to one stack belongs in a `REPO_NOTES` example instead.
            - `scripts/assemble-prompt.sh` interpolates maintainer-controlled input into a
              prompt. Check that repo notes cannot break out of the heredoc delimiter or inject
              step outputs, and that nothing untrusted reaches a workflow expression
              interpolation in `action.yml`, which the runner evaluates before bash sees it.
              Every variable the script reads must be passed by the action's `env:` block; a
              missing one is caught only at run time, by `set -u`.
            - `scripts/review.py post` is the only code that writes to a PR, and everything it
              posts comes from model output. Check that model text cannot spoof the bot's
              markers, escape its length caps, or steer which comment gets edited.
            - The gating expression in the reusable workflow is the only thing standing between
              a stranger's comment and the maintainer's API key. Trace it per event.
            - Inputs documented in the README table must match `action.yml` and
              `.github/workflows/review.yml`. Drift between the three is a real finding.
